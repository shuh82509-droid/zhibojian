<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store">
  <title>直播中心工作台</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f5f1;color:#10231d}.app{display:grid;grid-template-columns:224px 1fr;height:100vh}.side{background:#123f32;color:#fff;padding:24px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 24px}.logo{width:40px;height:40px;border-radius:11px;background:#d7f36b;color:#123f32;display:grid;place-items:center;font:900 22px Georgia}.brand b{font-size:17px;letter-spacing:.08em}.brand small{display:block;color:#b8d1c7;font-size:10px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#d9e9e3;border-radius:10px;padding:12px;text-align:left;cursor:pointer;font-weight:700;transition:background .2s ease,color .2s ease,transform .2s ease}.nav button:hover{background:rgba(255,255,255,.08)}.nav button:active{transform:translateY(1px)}.nav button:focus-visible,.module-tabs button:focus-visible{outline:2px solid #d7f36b;outline-offset:2px}.nav button span{display:block;color:#8fb2a5;font-size:10px;font-weight:400;margin-top:2px}.nav button.active{background:#fff;color:#123f32}.nav button.active span{color:#799287}.spacer{flex:1}.user{border-top:1px solid #386052;padding:17px 8px 0;color:#d9e9e3;display:flex;align-items:center;gap:10px;min-width:0}.user-avatar{width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;border-radius:9px;background:#f4e5dc;color:#9a5735;font-weight:800}.user-copy{min-width:0}.user-copy b,.user-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-copy b{font-size:13px}.user-copy small{margin-top:1px;color:#9fc0b4;font-size:10px}.main{min-width:0;display:grid;grid-template-rows:58px 1fr}.top{background:#f8f9f5;border-bottom:1px solid #dfe3dc;display:flex;justify-content:space-between;align-items:center;padding:0 22px;gap:18px}.top-left{display:flex;align-items:center;gap:22px;min-width:0}.top b{font-size:16px;white-space:nowrap}.module-tabs{display:none;gap:6px}.module-tabs.show{display:flex}.module-tabs button{border:1px solid #d8dfd8;background:#fff;color:#51675e;border-radius:8px;padding:6px 11px;cursor:pointer}.module-tabs button.active{background:#176147;color:#fff;border-color:#176147}.badge{background:#e4f2e9;color:#176147;border-radius:20px;padding:6px 10px;font-size:12px}.view{width:100%;height:100%;border:0;background:#fff}.placeholder{padding:55px;max-width:900px}.placeholder h1{font-size:38px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #dde3dc;border-radius:15px;padding:20px}.card b{font-size:18px}.card p{color:#718078}@media(max-width:720px){.app{grid-template-columns:76px 1fr}.brand>div:last-child,.nav button span,.user,.badge{display:none}.brand{padding-left:4px}.nav button{font-size:11px;padding:11px 5px;text-align:center}.top{padding:0 10px}.top-left{gap:8px}.module-tabs button{padding:5px 7px;font-size:11px}.cards{grid-template-columns:1fr}}
  </style>
</head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">L</div><div><b>LIVE HUB</b><small>直播中心中枢系统</small></div></div><nav class="nav" id="nav">
  <button data-page="overview" class="active">WIS直播中心总览<span>月度目标 · 直播日历与关注事项</span></button>
  <button data-page="business">各直播间数据<span>场次经营 · 流量与人群表现</span></button>
  <button data-page="lifecycle">主播全生命周期管理<span>招聘池 + 主播档案历史快照</span></button>
  <button data-page="schedule">调度中心<span>飞书排班 · 受控写回</span></button>
  <button data-page="tasks">协同中心<span>实时违规 · 运营配置</span></button>
  <button data-page="materials">素材中心<span>内容物料 · 归档上传</span></button>
  <button data-page="coach-calendar">教练日历授权<span>四间负责人 · 本人只读授权</span></button>
 </nav><div class="spacer"></div><div class="user" aria-label="当前登录账号" aria-live="polite"><span class="user-avatar" id="platformAvatar">—</span><span class="user-copy"><b id="platformUserName">正在校验账号</b><small id="platformUserRole">中枢权限同步中</small></span></div></aside><main class="main"><header class="top"><div class="top-left"><b id="title">WIS直播中心总览</b><div class="module-tabs" id="lifeTabs"><button data-module="recruitment" class="active">招聘池</button><button data-module="anchors">主播档案</button></div></div><span class="badge">LIVE CENTER</span></header><section id="content"></section></main></div>
<script id="platformSessionData" type="application/json">__PLATFORM_SESSION__</script>
<script>
const nav=document.getElementById('nav');
const lifeTabs=document.getElementById('lifeTabs');
const title=document.getElementById('title');
const content=document.getElementById('content');
const platformAvatar=document.getElementById('platformAvatar');
const platformUserName=document.getElementById('platformUserName');
const platformUserRole=document.getElementById('platformUserRole');
const basePath=location.pathname.endsWith('/')?location.pathname:location.pathname+'/';
const pages={overview:['WIS直播中心总览',new URL('../data-center/?view=overview',location.href).href],business:['各直播间数据',new URL('../data-center/?view=data',location.href).href],recruitment:['主播全生命周期管理 · 招聘池',basePath+'modules/recruitment/recruitment-dashboard.html?embed=1&v=20260907a'],anchors:['主播全生命周期管理 · 主播档案',basePath+'modules/anchors/recruitment-dashboard.html?embed=1&v=20260907a'],schedule:['调度中心',new URL('../dispatch-center/?view=current',location.href).href],materials:['素材中心',basePath+'modules/materials/material-center.html?embed=1&v=20260907a'],tasks:['协同中心',basePath+'modules/tasks/'], 'coach-calendar':['教练本人日历授权',basePath+'coach-calendar.html']};
const placeholders={schedule:['调度中心','统一排班、资源位与规则预设'],materials:['素材中心','沟通稿、话术库与直播素材'],tasks:['协同中心','任务、提醒与审批协同']};
const embeddedCss=`
  .app-shell > .sidebar,.ops-shell > .ops-sidebar,.layout > .side{display:none!important}
  .app-shell{display:block!important}
  .app-shell > main,.app-shell > .material-page{width:100%!important;max-width:none!important;margin-left:0!important}
  .material-page{width:100%!important;max-width:none!important;margin-left:0!important}
  .ops-shell{display:block!important}
  .ops-content{width:100%!important;max-width:none!important;margin:0!important}
  .layout{display:block!important}
  .layout > .main{width:100%!important;max-width:none!important;margin-left:0!important}
`;
function cleanEmbeddedNavigation(frame,key){try{const frameUrl=new URL(frame.contentWindow?.location?.href||frame.src,location.href);const shellPath=basePath.replace(/\/$/,'');if(frameUrl.origin===location.origin&&(frameUrl.pathname===shellPath||frameUrl.pathname===shellPath+'/')){frame.src=pages[key][1];return}const doc=frame.contentDocument;if(!doc)return;if(!doc.getElementById('live-hub-embedded-style')){const style=doc.createElement('style');style.id='live-hub-embedded-style';style.textContent=embeddedCss;doc.head.appendChild(style);doc.documentElement.dataset.liveHubEmbedded='true'}if(!doc.documentElement.dataset.liveHubNavigationGuard){doc.documentElement.dataset.liveHubNavigationGuard='true';doc.addEventListener('click',event=>{const link=event.target.closest?.('a[href]');if(!link||link.target==='_blank')return;const targetUrl=new URL(link.href,frameUrl);if(targetUrl.origin!==location.origin||(targetUrl.pathname!==shellPath&&targetUrl.pathname!==shellPath+'/'))return;event.preventDefault();if(targetUrl.hash==='#schedule')openPage('schedule');else if(targetUrl.hash==='#materials')openPage('materials');else openPage(key)},true)}}catch(error){console.warn('Unable to apply embedded layout',error)}}
function renderFrame(key){title.textContent=pages[key][0];content.innerHTML='<iframe class="view" title="'+pages[key][0]+'" data-module="'+key+'" src="'+pages[key][1]+'"></iframe>';const frame=content.querySelector('iframe');frame.addEventListener('load',()=>cleanEmbeddedNavigation(frame,key))}
function openLifecycle(module='recruitment'){lifeTabs.classList.add('show');document.querySelectorAll('#lifeTabs button').forEach(x=>x.classList.toggle('active',x.dataset.module===module));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page==='lifecycle'));renderFrame(module);location.hash='lifecycle-'+module}
function openPage(key){lifeTabs.classList.remove('show');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===key));if(key==='lifecycle')return openLifecycle();if(pages[key])renderFrame(key);else{const p=placeholders[key];title.textContent=p[0];content.innerHTML='<div class="placeholder"><h1>'+p[0]+'</h1><p>'+p[1]+'，将在下一阶段接入。</p></div>'}location.hash=key}
nav.onclick=e=>{const b=e.target.closest('button');if(b)openPage(b.dataset.page)};
lifeTabs.onclick=e=>{const b=e.target.closest('button');if(b)openLifecycle(b.dataset.module)};
window.addEventListener('message',event=>{const frame=content.querySelector('iframe');if(event.origin!==location.origin||event.source!==frame?.contentWindow)return;if(event.data?.type==='wis-live-navigate'&&event.data?.page==='schedule')openPage('schedule')});
function renderPlatformSession(payload){const name=String(payload.user?.name||'已授权成员').trim();platformUserName.textContent=name;platformUserRole.textContent=payload.user?.role||'已授权成员';platformAvatar.textContent=[...name][0]||'用'}
async function loadPlatformSession(){try{const embedded=String(document.getElementById('platformSessionData')?.textContent||'').trim();if(embedded&&embedded!=='__PLATFORM_SESSION__'){renderPlatformSession(JSON.parse(embedded));return}const response=await fetch(basePath+'api/session',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'中枢账号校验失败');renderPlatformSession(payload)}catch(error){platformUserName.textContent='账号校验失败';platformUserRole.textContent=error.message||'请重新进入中枢'}}
loadPlatformSession();
const initial=(location.hash.slice(1)||'overview');if(initial==='lifecycle-anchors')openLifecycle('anchors');else if(initial==='lifecycle-recruitment'||initial==='recruitment'||initial==='anchors')openLifecycle(initial==='anchors'?'anchors':'recruitment');else openPage(initial==='morning'?'overview':initial==='data'?'business':initial);
</script></body></html>

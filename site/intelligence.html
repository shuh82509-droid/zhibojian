<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 洞察</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#14352a;font:14px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif}.page{padding:34px;max-width:1500px;margin:auto}.hero{background:linear-gradient(120deg,#123f32,#1c6650);color:#fff;border-radius:20px;padding:28px 30px;display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.16em;color:#c8e4d7;font-weight:700}.hero h1{font-size:32px;margin:5px 0}.hero p{margin:0;color:#d7eae2}.button{border:0;border-radius:10px;background:#d7f36b;color:#14352a;font-weight:800;padding:12px 16px;cursor:pointer;white-space:nowrap}.status{margin:18px 0;padding:12px 15px;border:1px solid #d8e4dc;border-radius:11px;background:#fff;color:#60786e}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.card{background:#fff;border:1px solid #dce5df;border-radius:16px;padding:20px}.card h2{font-size:18px;margin:0 0 12px}.summary{font-size:16px;white-space:pre-wrap}.list{display:grid;gap:10px}.item{border-left:4px solid #1c8b63;background:#f7faf8;border-radius:8px;padding:12px}.item.urgent{border-left-color:#d75b48;background:#fff8f6}.item h3{font-size:15px;margin:0 0 5px}.meta{font-size:12px;color:#6e8179;margin-top:7px}.empty{color:#76877f;padding:12px 0}.coverage{margin-top:16px;font-size:12px;color:#6e8179}.section{margin-top:16px}@media(max-width:820px){.page{padding:16px}.hero{display:block}.button{margin-top:16px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="page"><section class="hero"><div><div class="eyebrow">MINIMAX · COCO · FEISHU INTELLIGENCE</div><h1>直播中心 AI 洞察</h1><p>自动汇总已授权的飞书群聊与文档，识别风险、待办及运营变化。</p></div><button class="button" id="refresh">立即重新分析</button></section><div class="status" id="status">正在读取最新情报…</div><section class="grid"><article class="card"><h2>综合结论</h2><div class="summary" id="overview"></div><div class="coverage" id="coverage"></div></article><article class="card"><h2>优先风险</h2><div class="list" id="urgent"></div></article></section><section class="grid section"><article class="card"><h2>待办与跟进</h2><div class="list" id="actions"></div></article><article class="card"><h2>排班与资源</h2><div class="list" id="schedule"></div></article></section><section class="grid section"><article class="card"><h2>招聘动态</h2><div class="list" id="recruitment"></div></article><article class="card"><h2>内容与素材更新</h2><div class="list" id="content"></div></article></section></main><script>
const root=location.pathname.replace(/\/intelligence\.html$/, '/');
const text=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function renderList(id,items,urgent=false){const box=document.getElementById(id);if(!items?.length){box.innerHTML='<div class="empty">暂无需要重点关注的信息。</div>';return}box.innerHTML=items.map(item=>{const title=item.title||item.task||item.name||'待确认事项';const evidence=item.evidence||item.recommendedAction||item.description||'';const meta=[item.priority,item.owner&&'负责人：'+item.owner,item.due&&'时间：'+item.due,item.source].filter(Boolean).join(' · ');return `<div class="item ${urgent?'urgent':''}"><h3>${text(title)}</h3><div>${text(evidence)}</div>${meta?`<div class="meta">${text(meta)}</div>`:''}</div>`}).join('')}
async function load(force=false){const status=document.getElementById('status'),button=document.getElementById('refresh');button.disabled=true;button.textContent=force?'分析中…':'刷新中…';status.textContent='MiniMax 正在处理 Coco 从飞书读取的资料，请稍候…';try{const response=await fetch(root+'api/intelligence/briefing'+(force?'?refresh=1':''),{cache:'no-store'});const payload=await response.json();if(!response.ok||!payload.ok)throw new Error(payload.error||'AI 洞察读取失败');const data=payload.data;document.getElementById('overview').textContent=data.overview||'暂无可用摘要。';renderList('urgent',data.urgent,true);renderList('actions',data.actionItems);renderList('schedule',data.schedule);renderList('recruitment',data.recruitment);renderList('content',data.content);const c=data.coverage||{};status.textContent=`已由 ${data.model} 生成 · ${new Date(data.generatedAt).toLocaleString('zh-CN')}`;document.getElementById('coverage').textContent=`覆盖：${c.chats||0} 个群聊、${c.documents||0} 篇飞书文档${c.failures?.length?'；'+c.failures.length+' 个来源暂未读取':''}。`;}catch(error){status.textContent='AI 洞察暂不可用：'+error.message}finally{button.disabled=false;button.textContent='立即重新分析'}}document.getElementById('refresh').addEventListener('click',()=>load(true));load();
</script></body></html>

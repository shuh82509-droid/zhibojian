<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教练本人日历授权 · WIS 直播中心</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6faf8;color:#173c30;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:850px;margin:48px auto;padding:0 20px}.card{background:white;border:1px solid #d9e8df;border-radius:18px;padding:28px;box-shadow:0 14px 36px #0e3c2912}h1{font-size:26px;margin:0 0 8px}p{color:#526b5e}.badge{display:inline-block;border-radius:20px;background:#edf6ef;padding:4px 12px;color:#116549;font-weight:700}.status{margin:24px 0;border:1px solid #e0eae2;border-radius:12px;padding:16px;background:#f8fbf9}button{border:0;border-radius:9px;padding:11px 18px;background:#176147;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#edf5f0;color:#176147;margin-left:8px}small{display:block;color:#71847a;margin-top:18px}
</style></head><body><main><section class="card"><span class="badge">仅限教练本人</span><h1>复盘日历只读授权</h1>
<p>官旗、品牌精选、优选、王鸥美肤的主负责人可分别授权系统读取<strong>本人日历</strong>。系统只从本绩效周日程中提取事件 ID、日期和标题，识别同时包含主播姓名与“复盘”的记录；不替你创建、编辑或删除日程，也不要求把日历共享给舒豪。</p>
<div class="status" id="status" role="status" aria-live="polite">正在核验 OA 与飞书本人身份……</div>
<button id="authorize" type="button" disabled>开始本人飞书只读授权</button><button id="refresh" type="button" class="secondary">刷新状态</button>
<small>请使用你本人的飞书账号完成授权。授权失败或尚未完成时，复盘次数保持“待核验”，不会发送含推测次数的提醒。授权可在飞书授权管理中撤销。</small></section></main>
<script>
const root=location.pathname.replace(/coach-calendar\.html$/,'');
const endpoint=root+'api/lifecycle/coach-calendar-auth/';
const status=document.getElementById('status'),button=document.getElementById('authorize');
const heldMessage='本人日历授权交换或续期结果待核验，已停止访问与自动重试。请勿刷新回调页或重复授权；需由管理员独立核验后恢复。';
const unavailableMessage='本人日历授权状态暂时无法安全核验，未发起新的授权。请勿刷新回调页或重复授权；请先核验处理结果。';
let generation=0,starting=false;
function show(message){status.textContent=message}
function held(calendar){return calendar.status==='recovery_required'||calendar.recoveryRequired===true||calendar.retryAllowed===false}
async function load(){
 if(starting)return;
 const turn=++generation;button.disabled=true;show('正在核验本人日历授权状态……');
 try{
  const response=await fetch(endpoint+'status',{credentials:'same-origin',cache:'no-store'}),data=await response.json();
  if(turn!==generation||starting)return;
  if(!response.ok||data.ok!==true){show(data.code==='calendar_refresh_recovery_required'?heldMessage:unavailableMessage);return;}
  const calendar=data.calendar;
  if(!calendar||typeof calendar!=='object'||Array.isArray(calendar)||typeof calendar.authorized!=='boolean'
   ||typeof calendar.configured!=='boolean'||typeof data.enabled!=='boolean'
   ||(calendar.status!==undefined&&calendar.status!=='recovery_required')
   ||(calendar.recoveryRequired!==undefined&&typeof calendar.recoveryRequired!=='boolean')
   ||(calendar.retryAllowed!==undefined&&typeof calendar.retryAllowed!=='boolean')
   ||(calendar.configured===false&&calendar.authorized)){show(unavailableMessage);return;}
  if(held(calendar)){show(heldMessage);return;}
  show(`${data.coachName} · ${data.room}：${calendar.authorized?'本人日历只读授权有效':calendar.configured?'本人日历尚未授权、已过期或待核验。':'本人日历用户授权配置不完整'}${data.enabled?'':'；授权入口尚未开放'}`);
  button.disabled=!data.enabled||calendar.authorized||!calendar.configured;
 }catch{if(turn===generation&&!starting)show(unavailableMessage);}
}
button.onclick=async()=>{
 if(starting||button.disabled)return;
 starting=true;++generation;button.disabled=true;show('正在核验本人身份并生成一次性授权链接……');
 try{
  const response=await fetch(endpoint+'start',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/json'},body:'{}'}),data=await response.json();
  if(data.retryAllowed===false||data.recoveryRequired===true||data.status==='recovery_required'||data.code==='calendar_refresh_recovery_required'){show(heldMessage);return;}
  if(!response.ok||data.ok!==true){show(data.code==='calendar_refresh_recovery_required'?heldMessage:unavailableMessage);return;}
  const destination=new URL(data.authorizeUrl);
  if(destination.protocol!=='https:'||destination.hostname!=='accounts.feishu.cn'||destination.username||destination.password||destination.port){show('授权地址未通过校验，未打开授权页面。请先核验状态。');return;}
  window.top.location.assign(destination.href);
 }catch{show(unavailableMessage);}
 finally{starting=false;button.disabled=true;}
};
document.getElementById('refresh').onclick=load;load();
</script></body></html>

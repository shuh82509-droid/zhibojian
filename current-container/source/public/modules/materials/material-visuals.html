<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉素材 · 素材中心</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="material-center.css">
<style>
.visual-library{padding:28px;max-width:1600px;margin:auto;color:#15392e}.visual-header,.visual-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.visual-header h1{margin-right:auto}.visual-library button,.visual-library input{font:inherit;border:1px solid #bfd1c8;border-radius:7px;padding:9px 13px;background:#fff;color:#174e3a}.visual-library button{cursor:pointer}.visual-library button:disabled{opacity:.55;cursor:wait}.visual-library .primary{background:#176b50;color:#fff}.visual-tools input{flex:1;min-width:220px}.visual-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.visual-file{border:1px solid #dce8e2;border-radius:12px;overflow:hidden;background:#fff;min-width:0}.visual-file .preview{height:180px;width:100%;padding:0;border:0;border-radius:0;background:#f1f6f3;display:grid;place-items:center;font-weight:600}.visual-file img{width:100%;height:180px;object-fit:contain}.visual-file .file-copy{padding:14px}.file-copy b{display:block;overflow-wrap:anywhere}.file-copy small{display:block;font-size:12px;margin:7px 0;color:#586e64}.file-copy a{color:#176b50}.visual-folders{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.visual-folder{font-weight:600}.visual-status{min-height:28px;margin-bottom:14px;color:#3c6050;white-space:pre-line}.visual-library dialog{max-width:90vw;max-height:90vh;border:1px solid #b4c8bd;border-radius:12px;padding:18px}.visual-library dialog img,.visual-library dialog video{max-width:82vw;max-height:72vh;display:block}.visual-library dialog form{text-align:right;margin-bottom:12px}.visual-library :focus-visible{outline:3px solid #2f8266;outline-offset:3px}.visual-library .folder-form{display:flex;gap:10px;flex-wrap:wrap;padding:16px 0}.visual-library [hidden]{display:none!important}
</style><style>.visual-themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}.visual-theme{display:grid;gap:5px;text-align:left;padding:15px 16px;border-radius:11px}.visual-theme b{font-size:15px}.visual-theme span{color:#667a70;font-size:12px;line-height:1.5}.visual-theme.active{border-color:#176b50;background:#eef8f3}.visual-theme.active span{color:#386957}@media(max-width:760px){.visual-themes{grid-template-columns:1fr}}</style></head><body><main class="visual-library">
<header class="visual-header"><h1>视觉素材</h1><button id="createFolder">新建文件夹</button><button id="uploadFolder">上传本地文件夹</button><button id="uploadFiles" class="primary">上传文件</button></header>
<p>按文件夹归档产品图、背景板、贴片、设计源文件与音视频。单个文件最大 50MB；源文件和压缩包原样保存、下载，不在线执行或解压。</p>
<section class="visual-themes" aria-label="视觉素材主题目录"><button type="button" class="visual-theme" data-theme="大促主题"><b>大促主题</b><span>节点大促、机制爆发和限时氛围视觉</span></button><button type="button" class="visual-theme" data-theme="品牌色平销"><b>品牌色平销</b><span>日常品牌色、常规陈列和平销画面</span></button><button type="button" class="visual-theme" data-theme="特殊内容场"><b>特殊内容场</b><span>栏目、联动、剧情和其他特别内容场景</span></button></section>
<div class="visual-tools"><button id="upFolder">全部素材</button><input id="visualSearch" type="search" placeholder="搜索文件名或文件夹"><button id="refresh">刷新</button></div>
<form id="folderForm" class="folder-form" hidden><label>文件夹名称 <input id="folderName" maxlength="100" required></label><button class="primary">创建</button><button type="button" id="cancelFolder">取消</button></form>
<input id="filesInput" type="file" multiple hidden><input id="folderInput" type="file" webkitdirectory multiple hidden>
<p id="status" role="status" class="visual-status">正在读取已保存素材…</p><h2 id="folderHeading">全部素材</h2><div id="folders" class="visual-folders"></div><div id="visualList" class="visual-list"></div>
<dialog id="previewDialog"><form method="dialog"><button>关闭预览</button></form><div id="previewContent"></div></dialog>
</main><script src="material-visuals.js?v=20260907a"></script></body></html>

    const groupRoot = document.querySelector('#scriptGroups');

    const categoryTabs = [...document.querySelectorAll('[data-category-filter]')];
    let activeCategory = '全部';
    function applyCategoryFilter() {
      const sections = [...groupRoot.querySelectorAll('.script-category')];
      let shown = 0;
      sections.forEach((section) => {
        const category = section.querySelector('.script-category-header h2')?.textContent.trim();
        const visible = activeCategory === '全部' || category === activeCategory;
        section.hidden = !visible;
        if (visible) shown += 1;
      });
      emptyState.hidden = shown !== 0;
    }
    const categoryOrder = ['水润面膜','晶润眼膜','乳糖酸面膜','微针面膜','深海次抛','燕窝面膜'];
    const platformOrder = ['抖音','视频号','通用'];
    function itemMarkup(item) { const [category, platform, scene, persona, title, href] = item; const detail = `${category} · ${platform} · ${scene}${persona ? ` · ${persona}` : ''}`; return `<a class="script-item script-link" target="_blank" rel="noopener" href="${escapeHtml(href)}"><span class="file-mark doc">DOC</span><span><b>${escapeHtml(title)}</b><small>${escapeHtml(detail)}</small></span><em>打开</em></a>`; }
    function renderScripts(query = '') {
      const q = query.trim().toLowerCase();
      const allScripts = [...scriptData, ...uploadedScriptData];
      const visible = allScripts.filter(item => !q || item.join(' ').toLowerCase().includes(q));
      emptyState.hidden = visible.length !== 0;
      groupRoot.innerHTML = categoryOrder.map(category => {
        const categoryItems = visible.filter(item => item[0] === category);
        if (!categoryItems.length) return '';
        const platforms = platformOrder.map(platform => {
          const platformItems = categoryItems.filter(item => item[1] === platform);
          if (!platformItems.length) return '';
          const scenes = [...new Set(platformItems.map(item => item[2]))].map(scene => {
            const sceneItems = platformItems.filter(item => item[2] === scene);
            return `<div class="script-scene"><h4>${escapeHtml(scene)}</h4><div class="script-list">${sceneItems.map(itemMarkup).join('')}</div></div>`;
          }).join('');
          const modifier = platform === '视频号' ? ' video' : platform === '通用' ? ' common' : '';
          return `<div class="script-platform${modifier}"><h3>${escapeHtml(platform)}</h3>${scenes}</div>`;
        }).join('');
        return `<section class="script-category"><header class="script-category-header"><div><h2>${escapeHtml(category)}</h2><p>按平台与人设／直播场景连续归类</p></div><span class="script-category-count">${categoryItems.length} 篇</span></header>${platforms}</section>`;
      }).join('');
      applyCategoryFilter();
    }
    window.updateUploadedScripts = (items) => {
      uploadedScriptData = items.map(item => [item.category, '通用', '新增归档', `飞书 ${item.sourceType === 'docx' ? 'Docx' : 'Wiki'}`, item.title, item.url]);
      renderScripts(searchInput.value);
    };
    searchInput.addEventListener('input', () => renderScripts(searchInput.value));
    renderScripts();
    searchInput.addEventListener('input', () => setTimeout(applyCategoryFilter, 0));
    categoryTabs.forEach((tab) => tab.addEventListener('click', () => {

      categoryTabs.forEach((button) => {
        const selected = button === tab;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-selected', String(selected));
      });
      applyCategoryFilter();
    }));
    applyCategoryFilter();

      const status = document.getElementById('scriptUploadStatus');
      const list = document.getElementById('uploadedScripts');
      const escapeText = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const render = (items) => {
        const scripts = items.filter((item) => item.kind === 'communication');
        window.updateUploadedScripts(scripts);
      };
      const load = async () => {
        try {
          const response = await fetch(`${appBase}/api/material-links`, {credentials:'same-origin'});
          if (!response.ok) throw new Error('读取失败');
          const payload = await response.json();
          if (!payload.ok) throw new Error(payload.error || '读取失败');
          render(payload.links || []);
        } catch (error) {
          status.textContent = '稿件归档暂时无法读取，请稍后重试。';
        }
      };
      toggle.addEventListener('click', () => { form.hidden = !form.hidden; if (!form.hidden) title.focus(); });
      form.addEventListener('submit', async (event) => {
        event.preventDefault(); status.textContent = '正在保存…';
        try {
          const response = await fetch(`${appBase}/api/material-links`, {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'communication',category:product.value,title:title.value.trim(),url:url.value.trim()})});
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || '保存失败');
          title.value = ''; url.value = ''; status.textContent = `已保存到下方“${product.value}”品类，可直接打开飞书原文。`;
          await load();
        } catch (error) { status.textContent = error.message || '保存失败'; }
      });
      load();
    })();
  </script>
  <script src="../../coco-links.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播手卡 · 素材中心</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="material-center.css"><link rel="stylesheet" href="material-modules.css"><style>
.cue-folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.cue-folder{position:relative;min-height:244px;padding:0;border:1px solid #e2e6ec;border-radius:15px;overflow:hidden;background:#fff;text-align:left;color:#172033;box-shadow:0 7px 20px rgba(25,38,68,.05);cursor:pointer}.cue-folder:hover{transform:translateY(-2px);border-color:#aebcf6}.cue-cover{height:150px;display:grid;place-items:center;background:linear-gradient(145deg,#eef1ff,#f8f4ea);overflow:hidden}.cue-cover img{width:100%;height:100%;object-fit:cover}.cue-cover span{font-size:36px;color:#7885a6}.cue-folder-copy{display:block;padding:13px}.cue-folder-copy b{display:block;font-size:15px}.cue-folder-copy small{display:block;margin-top:5px;color:#7c8799}.cue-folder-copy em{display:inline-block;margin-top:10px;padding:3px 7px;border-radius:999px;background:#eef1ff;color:#4964ce;font-style:normal;font-size:10px}.cue-editor-simple{display:grid;gap:13px}.cue-editor-simple label{display:grid;gap:6px;color:#566175;font-size:12px}.cue-editor-simple input,.cue-editor-simple select{width:100%;padding:10px 11px;border:1px solid #dfe4ec;border-radius:9px;background:#fff}.cue-upload-preview{min-height:150px;display:grid;place-items:center;border:1px dashed #ccd4e2;border-radius:11px;background:#f7f8fb;color:#8a94a6;overflow:hidden}.cue-upload-preview img{width:100%;max-height:300px;object-fit:contain}.editor-actions button{background:#315ee9;color:#fff}.cue-legacy-note{margin:0;color:#8a6470;font-size:11px;line-height:1.6}.cue-version-history{padding:11px;border:1px solid #e4e8ef;border-radius:9px;background:#f8fafc;color:#647084;font-size:11px;line-height:1.7}.cue-version-history b{display:block;color:#344054}.cue-layout{grid-template-columns:minmax(0,1fr) minmax(320px,420px)}.cue-editor{position:static;max-height:none;overflow:visible}@media(max-width:920px){.cue-layout{grid-template-columns:1fr}}

.cue-product-group{margin-bottom:30px}.cue-product-group h2{font-size:20px;margin:0 0 16px}.cue-product-group h2 small{font-weight:400;font-size:14px;color:#586779}.cue-folder{overflow:visible;box-shadow:none;cursor:default}.cue-folder:hover{transform:none}.cue-cover{width:100%;border:0;border-radius:14px 14px 0 0;cursor:zoom-in}.cue-title{position:relative}.cue-title-button{border:0;background:transparent;color:#172033;font:600 15px inherit;text-align:left;padding:6px 0;overflow-wrap:anywhere;cursor:text}.cue-quick-editor{display:none;position:absolute;top:100%;left:0;width:min(340px,75vw);padding:16px;background:white;border:1px solid #aec7bd;border-radius:10px;box-shadow:0 8px 24px #17352b22;z-index:20}.cue-title:hover .cue-quick-editor,.cue-title:focus-within .cue-quick-editor,.cue-title.expanded .cue-quick-editor{display:block}.cue-quick-editor label{display:block;font-size:13px;margin-bottom:8px}.cue-quick-editor input:not([type=checkbox]){width:100%;min-height:34px;border:1px solid #b7c7bf;border-radius:5px;padding:5px}.cue-quick-editor fieldset{border:0;padding:8px 0;display:flex;flex-wrap:wrap;gap:8px}.cue-quick-editor fieldset label{white-space:nowrap}.cue-tags{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}.cue-tags span{font-size:12px;background:#edf5f0;padding:3px 6px;color:#23543e;border-radius:4px}.cue-card-actions{display:flex;justify-content:space-between;gap:8px;align-items:center}.cue-card-actions button,.cue-quick-editor button{min-height:32px;border:1px solid #a7c2b6;border-radius:5px;padding:5px 8px;color:#165940;background:#f2f8f5}.cue-card-actions a{font-size:13px;color:#165940}#cuePreviewDialog{max-width:94vw;max-height:94vh;border:1px solid #bdcec7;border-radius:12px;padding:18px}#cuePreviewDialog img{display:block;max-width:85vw;max-height:78vh;object-fit:contain}#cuePreviewDialog form{text-align:right;margin-bottom:10px}
</style><link rel="stylesheet" href="material-cue-cards-fixes.css?v=20260902a"></head>
<body><main class="material-library-page cue-page">
  <div class="material-topline"><div><p class="material-eyebrow">LIVE CUE CARD LIBRARY</p><h1>直播手卡</h1><p>按直播间和品类归档图片手卡；图片从电脑选择并上传，不再填写外部图片地址。</p></div><button class="primary-action" id="newCard">＋ 上传手卡</button></div>
  <section class="cue-toolbar"><input id="search" type="search" placeholder="搜索标题、直播间或品类"><select id="roomFilter"><option value="">全部直播间</option><option>官旗</option><option>品牌精选</option><option>优选</option><option>王鸥美肤</option><option>通用</option></select><select id="sort"><option value="updated">最近更新</option><option value="title">标题排序</option></select><span id="latest">最近更新 · 待同步</span></section>
  <div class="cue-layout"><section><div id="cards" class="cue-product-groups"><div class="empty-material">正在读取手卡…</div></div></section>
  <aside class="cue-editor" id="editor" hidden><div class="editor-head"><div><small id="editorMode">上传手卡</small><h2 id="editorTitle">新手卡</h2></div><button id="closeEditor" aria-label="关闭">×</button></div>
    <div class="cue-editor-simple"><input id="cardId" type="hidden"><input id="cover" type="hidden"><label>直播间<select id="room"><option>官旗</option><option>品牌精选</option><option>优选</option><option>王鸥美肤</option><option>通用</option></select></label><label>产品 / 品类<input id="category" maxlength="40" placeholder="面膜 / 眼膜 / 次抛"></label><label>标题<input id="title" maxlength="120" placeholder="可留空，将按图片文件名生成"></label><label>标签（逗号分隔，可自定义）<input id="cardTags" maxlength="600" placeholder="数据, 痛点, 比价, 用法, 机制, 无添加, 敏敏肌, 功效, 售后保障"></label><label>手卡图片（可一次多选，单个最大 10MB）<input id="coverFile" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif,.png,.jpg,.jpeg,.webp,.gif"></label><div class="cue-upload-preview" id="coverPreview">可一次选择多张本地图片</div><div class="cue-version-history" id="versionHistory"><b>版本记录</b>新手卡尚无历史版本。</div><p class="cue-legacy-note">新上传手卡默认以“未提交”状态安全保存；历史审核状态和版本记录继续保留，但不再要求上传人手工选择流程状态。</p><div class="editor-actions"><button id="saveCard">上传并保存到手卡库</button></div><p class="save-message" id="message"></p></div>
  </aside></div>
</main><dialog id="cuePreviewDialog"><form method="dialog"><button aria-label="关闭预览">关闭</button></form><img alt="手卡预览"></dialog><script>
const base=location.pathname.split('/modules/')[0],api=`${base}/api/material-cards`,assetApi=`${base}/api/material-assets`,cardsRoot=document.querySelector('#cards'),cueLayout=document.querySelector('.cue-layout'),editor=document.querySelector('#editor'),titleInput=document.querySelector('#title'),messageRoot=document.querySelector('#message'),versionHistoryRoot=document.querySelector('#versionHistory'),newCard=document.querySelector('#newCard'),closeEditor=document.querySelector('#closeEditor'),saveCard=document.querySelector('#saveCard'),search=document.querySelector('#search'),roomFilter=document.querySelector('#roomFilter'),sort=document.querySelector('#sort'),latest=document.querySelector('#latest'),cardId=document.querySelector('#cardId'),cover=document.querySelector('#cover'),coverFile=document.querySelector('#coverFile'),room=document.querySelector('#room'),category=document.querySelector('#category'),editorMode=document.querySelector('#editorMode'),editorTitle=document.querySelector('#editorTitle'),coverPreview=document.querySelector('#coverPreview');let cards=[],editingCard=null;
const builtInTags=['数据','痛点','比价','用法','机制','无添加','敏敏肌','功效','售后保障'];
const tagsInput=document.querySelector('#cardTags');
const safeCover=value=>{try{const u=new URL(value,location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};
const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const dateTime=value=>{if(!value)return'—';const date=new Date(value);return Number.isNaN(date.getTime())?'—':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(date)};
const fileData=file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('本地文件读取失败'));reader.readAsDataURL(file)});
async function uploadAsset(kind,file,titleValue){const response=await fetch(assetApi,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,name:file.name,title:titleValue,dataUrl:await fileData(file)})}),result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'上传失败');return result.asset}
function filtered(){const query=search.value.trim().toLowerCase(),roomValue=roomFilter.value;return cards.filter(card=>(!roomValue||card.room===roomValue)&&(!query||[card.title,card.room,card.category,...(card.tags||[])].join(' ').toLowerCase().includes(query))).sort((a,b)=>sort.value==='title'?String(a.title).localeCompare(String(b.title),'zh-CN'):String(b.updatedAt).localeCompare(String(a.updatedAt)))}
function statusLabel(value){return value==='approved'?'已审批':value==='review'?'待审核':'未提交'}
function render(){
  const list=filtered(), groups=new Map();
  list.forEach(card=>{const key=card.products?.[0]||card.category||'未分类';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(card)});
  cardsRoot.innerHTML=list.length?[...groups].map(([product,items])=>'<section class="cue-product-group"><h2>'+esc(product)+' <small>'+items.length+' 张</small></h2><div class="cue-folder-grid">'+items.map(card=>{
    const url=safeCover(card.cover), download=url?url+(url.includes('?')?'&':'?')+'download=1':'';
    return '<article class="cue-folder" data-id="'+esc(card.id)+'"><button type="button" class="cue-cover cue-preview" aria-label="预览 '+esc(card.title)+'">'+(url?'<img loading="lazy" src="'+esc(url)+'" alt="'+esc(card.title)+'">':'暂无图片')+'</button><div class="cue-folder-copy"><div class="cue-title"><button type="button" class="cue-title-button">'+esc(card.title)+'</button><div class="cue-quick-editor"><label>标题<input data-quick-title maxlength="120" value="'+esc(card.title)+'"></label><fieldset><legend>标签</legend>'+builtInTags.map(tag=>'<label><input type="checkbox" value="'+esc(tag)+'" '+((card.tags||[]).includes(tag)?'checked':'')+'>'+esc(tag)+'</label>').join('')+'</fieldset><label>自定义标签<input data-custom-tags value="'+esc((card.tags||[]).filter(tag=>!builtInTags.includes(tag)).join(','))+'" placeholder="多个标签用逗号分隔"></label><button type="button" data-quick-save>保存标题与标签</button><p role="status"></p></div></div><small>'+esc(card.room)+'</small><div class="cue-tags">'+(card.tags||[]).map(tag=>'<span>'+esc(tag)+'</span>').join('')+'</div><div class="cue-card-actions"><button class="cue-action-edit" type="button" data-edit>✎ 编辑</button>'+(download?'<a class="cue-action-download" href="'+esc(download)+'" download>⇩ 下载</a>':'')+'<button class="cue-action-delete" type="button" data-delete>⌫ 删除</button></div></div></article>';
  }).join('')+'</div></section>').join(''):'<div class="empty-material">暂无匹配手卡，点击右上角上传。</div>';
  cardsRoot.querySelectorAll('.cue-folder').forEach(item=>{
    const card=cards.find(card=>card.id===item.dataset.id);
    item.querySelector('[data-edit]').onclick=()=>openEditor(card);
    item.querySelector('[data-delete]').onclick=async event=>{if(!window.confirm(`确认删除手卡“${card.title}”？删除后将进入可恢复归档，不会删除原始素材文件。`))return;const button=event.currentTarget;button.disabled=true;try{const response=await fetch(`${api}/${encodeURIComponent(card.id)}`,{method:'DELETE',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({expectedVersion:card.version})}),result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'删除失败');await load()}catch(error){button.disabled=false;window.alert(error.message)}};
    item.querySelector('.cue-title-button').onclick=()=>item.querySelector('.cue-title').classList.toggle('expanded');
    item.querySelector('.cue-preview').onclick=()=>{const modal=document.querySelector('#cuePreviewDialog');modal.querySelector('img').src=safeCover(card.cover);modal.querySelector('img').alt=card.title;modal.showModal()};
    item.querySelector('[data-quick-save]').onclick=async event=>{
      const button=event.currentTarget, panel=button.closest('.cue-quick-editor'),note=panel.querySelector('[role=status]');
      button.disabled=true;note.textContent='保存中…';
      try{const tags=[...panel.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value).concat(panel.querySelector('[data-custom-tags]').value.split(/[,，]/u)).map(x=>x.trim()).filter(Boolean);
        const response=await fetch(api,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:card.id,expectedVersion:card.version,title:panel.querySelector('[data-quick-title]').value,tags,status:card.status==='approved'?'review':card.status})}),result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'保存失败');await load();
      }catch(error){note.textContent=error.message}finally{button.disabled=false}
    };
  });
}
function openEditor(card=null){editingCard=card;tagsInput.value=(card?.tags||[]).join(',');editor.hidden=false;cueLayout.classList.add('editor-open');cardId.value=card?.id||'';room.value=card?.room||'官旗';category.value=card?.category||'';titleInput.value=card?.title||'';cover.value=card?.cover||'';coverFile.value='';editorMode.textContent=card?'编辑手卡':'批量上传手卡';editorTitle.textContent=card?.title||'新手卡';versionHistoryRoot.innerHTML=`<b>版本记录</b>${card?.versions?.length?card.versions.slice().reverse().map(item=>`第 ${item.version} 版 · ${statusLabel(item.status)} · ${dateTime(item.updatedAt)} · ${esc(item.updatedBy||'已授权成员')}`).join('<br>'):'新手卡尚无历史版本。'}`;updateCover(card?.cover||'');editor.scrollIntoView({behavior:'smooth',block:'start'})}
function updateCover(source){coverPreview.innerHTML=source?`<img src="${esc(source)}" alt="手卡图片预览">`:'请选择本地 PNG / JPG 图片'}
async function load(){
  latest.textContent='正在读取手卡…';
  try{
    const cardResponse=await fetch(api,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000)});
    if(!cardResponse.ok)throw new Error(cardResponse.status===401||cardResponse.status===403?'登录或手卡权限需核验，请从中枢重新进入。':`手卡服务暂不可用（${cardResponse.status}）`);
    if(!cardResponse.headers.get('content-type')?.includes('application/json'))throw new Error('登录状态可能过期，请从中枢重新进入。');
    const cardPayload=await cardResponse.json();if(!cardPayload.ok||!Array.isArray(cardPayload.cards))throw new Error(cardPayload.error||'手卡返回格式异常');
    cards=cardPayload.cards;latest.textContent=`最近更新 · ${dateTime(cardPayload.updatedAt)}`;render();
  }catch(error){
    latest.textContent='本次读取失败 · 原有手卡未改动';
    const reason=['TimeoutError','AbortError'].includes(error.name)?'读取超时，请检查网络后重试。':error instanceof TypeError?'请求未完成，可能是网络或浏览器拦截；请重试或联系管理员核查。':error.message;
    if(cards.length)render();else cardsRoot.innerHTML='';
    const notice=document.createElement('div');notice.className='empty-material';notice.setAttribute('role','alert');
    notice.innerHTML=`<p>${esc(reason)}</p><button type="button">重新读取手卡</button>`;
    notice.querySelector('button').onclick=load;cardsRoot.prepend(notice);
  }
}
async function save(){messageRoot.textContent='保存中…';saveCard.disabled=true;try{const files=[...coverFile.files];if(!category.value.trim())throw new Error('请填写产品或品类，方便归档查找。');if(editingCard&&files.length>1)throw new Error('编辑已有手卡时请只替换一张图；批量上传请先点“上传手卡”。');if(!files.length&&!cover.value.trim())throw new Error('请选择本地手卡图片');const queue=files.length?files:[null],saved=[];for(let index=0;index<queue.length;index+=1){const file=queue[index];let coverUrl=cover.value.trim();if(file){messageRoot.textContent=`正在上传 ${index+1}/${queue.length}：${file.name}`;coverUrl=(await uploadAsset('cue-card',file,titleInput.value.trim()||file.name)).url}const fallbackTitle=file?file.name.replace(/\.[^.]+$/u,''):'未命名手卡',title=titleInput.value.trim()?(queue.length>1?`${titleInput.value.trim()} · ${fallbackTitle}`:titleInput.value.trim()):fallbackTitle;const payload={id:index===0&&editingCard?cardId.value:undefined,title,room:room.value,category:category.value.trim(),products:[category.value.trim()],tags:tagsInput.value.split(/[,，]/u).map(x=>x.trim()).filter(Boolean),expectedVersion:editingCard?.version,cover:coverUrl,status:editingCard?.status==='approved'?'review':editingCard?.status||'draft'},response=await fetch(api,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'保存失败');saved.push(result.card);if(file){const transfer=new DataTransfer();[...coverFile.files].filter(x=>x!==file).forEach(x=>transfer.items.add(x));coverFile.files=transfer.files}}messageRoot.textContent=`已成功保存 ${saved.length} 张手卡`;await load();if(saved.length===1)openEditor(saved[0]);else{editor.hidden=true;cueLayout.classList.remove('editor-open')}}catch(error){messageRoot.textContent=error.message}finally{saveCard.disabled=false}}
coverFile.addEventListener('change',async()=>{const files=[...coverFile.files];if(!files.length)return updateCover(cover.value);if(files.length===1)return updateCover(await fileData(files[0]));coverPreview.innerHTML=`<b>已选择 ${files.length} 张图片</b><span>${files.map(file=>esc(file.name)).join('<br>')}</span>`});
newCard.onclick=()=>openEditor();closeEditor.onclick=()=>{editor.hidden=true;cueLayout.classList.remove('editor-open')};search.addEventListener('input',render);roomFilter.addEventListener('change',render);sort.addEventListener('change',render);saveCard.onclick=save;load();
</script></body></html>
